<!DOCTYPE html>
<html>
<head>
    <title>FreshFirst - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf4ed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            color: #176b45;
            font-size: 32px;
            margin-bottom: 8px;
        }

        h2 {
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #176b45;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #105536;
        }

        #message {
            margin-top: 15px;
            color: #176b45;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-box">

        <h1>FreshFirst</h1>
        <h2>Welcome Back</h2>

        <p class="subtitle">Perishable Stock Verification Register</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const message = document.getElementById("message");

            message.textContent = "Checking login...";

            try {

                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json();

                if (response.ok) {

                    message.textContent =
                        "Login successful! Welcome " + data.full_name;

                    setTimeout(function() {
                        window.location.href = "/dashboard";
                    }, 700);

                } else {

                    message.textContent =
                        data.error || "Invalid username or password";

                }

            } catch (error) {

                message.textContent = "Server connection failed";

            }

        });
    </script>

</body>
</html>
